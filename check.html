<style>
.rp{max-width:900px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right,0px)) 60px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px}
.rp h2{font-size:clamp(21px,3vw,26px);margin:0 0 12px;text-wrap:balance}
.rp .kaart{padding:22px}
/* held: donkere band met 3D-meter */
.rp-held{position:relative;overflow:hidden;border-radius:28px;padding:34px 28px;display:grid;grid-template-columns:1.15fr .85fr;gap:20px;align-items:center;color:#e6f1ff;
  background:radial-gradient(120% 140% at 90% 10%,rgba(139,92,246,.4),transparent 55%),radial-gradient(90% 120% at 0% 100%,rgba(34,227,196,.32),transparent 55%),linear-gradient(160deg,#081226,#0c1a36 60%,#101034);box-shadow:0 30px 70px -30px rgba(20,40,100,.55)}
.rp-held::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(rgba(34,227,196,.06) 1px,transparent 1px) 0 0/100% 34px,linear-gradient(90deg,rgba(34,227,196,.06) 1px,transparent 1px) 0 0/34px 100%;mask-image:radial-gradient(circle at 75% 45%,#000,transparent 75%);-webkit-mask-image:radial-gradient(circle at 75% 45%,#000,transparent 75%)}
.rp-held>*{position:relative;min-width:0}
.rp-held .label{color:#22e3c4;margin:0 0 6px}
.rp-held h1.lang{font-size:clamp(24px,3.6vw,34px)}
.rp-held h1{font-size:clamp(28px,5vw,46px);line-height:1.05;margin:0 0 12px;word-break:break-word}
.rp-held p{color:#a9bdd8;margin:0}
.rp-bot{display:flex;align-items:flex-end;gap:10px;margin-top:18px}
.rp-bot .bot-mid{width:64px;height:64px}
.rp-ballon{background:rgba(255,255,255,.08);border:1px solid rgba(34,227,196,.35);border-radius:14px 14px 14px 4px;padding:9px 12px;font-size:14.5px;color:#e6f1ff;max-width:34ch}
/* 3D-meter */
@property --sc{syntax:"<number>";inherits:true;initial-value:0}
.meter3d{position:relative;height:300px;perspective:900px}
.meter3d-wereld{position:absolute;inset:0;transform-style:preserve-3d;animation:m3Wieg 9s ease-in-out infinite}
@keyframes m3Wieg{0%,100%{transform:rotateX(14deg) rotateY(-14deg)}50%{transform:rotateX(8deg) rotateY(12deg)}}
.m3-ring{position:absolute;left:50%;top:50%;width:210px;height:210px;margin:-105px 0 0 -105px;border-radius:50%;
  background:conic-gradient(var(--kl) calc(var(--sc) * 1%),rgba(255,255,255,.1) 0);animation:m3Vul 1.8s cubic-bezier(.2,.8,.2,1) .2s both;
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 20px),#000 calc(100% - 19px));mask:radial-gradient(farthest-side,transparent calc(100% - 20px),#000 calc(100% - 19px));filter:drop-shadow(0 0 18px var(--kl))}
@keyframes m3Vul{from{--sc:0}to{--sc:var(--doel)}}
.m3-schijf{position:absolute;left:50%;top:50%;width:160px;height:160px;margin:-80px 0 0 -80px;border-radius:50%;transform:translateZ(30px);
  background:radial-gradient(circle at 35% 30%,#1b2b4d,#0a1328 70%);box-shadow:inset 0 0 0 1px rgba(160,200,255,.2),0 20px 40px rgba(0,0,0,.45);display:grid;place-items:center;text-align:center}
.m3-schijf b{display:block;font-family:"JetBrains Mono",monospace;font-size:52px;line-height:1;color:#fff}
.m3-schijf small{font-size:12px;color:#a9bdd8}
.m3-schijf em{display:block;font-style:normal;font-size:13px;font-weight:700;margin-top:4px;color:var(--kl)}
.m3-chip{position:absolute;left:50%;top:50%;padding:8px 12px;border-radius:12px;font-weight:700;font-size:13px;white-space:nowrap;color:#04111a;background:linear-gradient(135deg,#22e3c4,#7cc4ff);box-shadow:0 14px 30px rgba(0,0,0,.35);animation:wowZweef 5s ease-in-out infinite}
.m3-chip small{display:block;font-weight:500;font-size:11px;opacity:.75}
.m3-chip.a{transform:translate(-170px,-110px) translateZ(80px)}
.m3-chip.b{transform:translate(20px,-140px) translateZ(110px);background:linear-gradient(135deg,#c4b5fd,#8b5cf6);color:#fff;animation-delay:-1.6s}
.m3-chip.c{transform:translate(10px,92px) translateZ(90px);background:linear-gradient(135deg,#ffe08a,#ffb547);animation-delay:-3.2s}
.m3-baan{position:absolute;left:50%;top:50%;width:300px;height:300px;margin:-150px 0 0 -150px;border-radius:50%;border:1px dashed rgba(34,227,196,.35);transform:translateZ(-40px)}
/* tegels */
.rp-tegels{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.rp-tegel{border:1px solid var(--lijn);border-radius:14px;padding:12px;min-width:0;background:var(--veld)}
.rp-tegel b{display:block;font-family:"JetBrains Mono",monospace;font-size:24px;font-variant-numeric:tabular-nums}
.rp-tegel span{font-size:13px;color:var(--zacht)}
.rp-tegel.slecht b{color:var(--fout)}.rp-tegel.matig b{color:var(--let)}.rp-tegel.goed b{color:var(--accent)}
/* bevindingen */
.rp-groep{display:flex;align-items:center;gap:8px;margin:16px 0 8px;font-family:"JetBrains Mono",monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--zacht)}
.rp-groep:first-of-type{margin-top:0}
.rp-groep i{font-style:normal;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--accent2);color:var(--accent);font-size:14px}
.rp-pb{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;border:1px solid var(--lijn);border-radius:14px;padding:12px 14px;margin-bottom:8px;background:var(--veld)}
.rp-pb .ernst{grid-row:span 2;font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;align-self:start;margin-top:3px;white-space:nowrap}
.rp-pb.hoog{border-left:4px solid var(--fout)}.rp-pb.hoog .ernst{color:var(--fout);background:var(--foutbg)}
.rp-pb.middel{border-left:4px solid var(--let)}.rp-pb.middel .ernst{color:var(--let);background:var(--letbg)}
.rp-pb.laag .ernst{color:var(--paarstekst);background:var(--paarsbg)}
.rp-pb b{font-weight:600}.rp-pb p{margin:0;font-size:14.5px;color:var(--zacht)}.rp-pb p em{font-style:normal;color:var(--tekst);font-weight:600}
.rp-goed{columns:2;column-gap:24px;padding-left:0;list-style:none;margin:0}
.rp-goed li{break-inside:avoid;padding:4px 0 4px 28px;position:relative;font-size:15px}
.rp-goed li::before{content:"✓";position:absolute;left:0;top:5px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--accent2);color:var(--accent)}
.rp-woord{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--lijn);padding:9px 0;font-size:15px;flex-wrap:wrap}
.rp-woord span{color:var(--zacht)}.rp-woord .ja{color:var(--accent)}.rp-woord .nee{color:var(--fout)}
/* advies */
.rp-advies{background:linear-gradient(var(--bg2),var(--bg2)) padding-box,linear-gradient(135deg,#22e3c4,#3b82f6 55%,#8b5cf6) border-box!important;border:1.5px solid transparent!important}
.rp-advies .label{color:var(--accent);margin:0 0 4px}
.rp-advies h2{font-size:clamp(24px,3.6vw,32px)}
.rp-waarom{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 18px}
.rp-waarom div{background:var(--accent2);border-radius:14px;padding:14px;font-size:14.5px;min-width:0}
.rp-waarom b{display:block;font-size:15.5px;margin-bottom:4px}
.rp-balken{display:flex;flex-direction:column;gap:10px;margin:10px 0 6px}
.rp-balk{display:grid;grid-template-columns:70px 1fr 120px;gap:10px;align-items:center;font-size:14.5px}
.rp-balk .spoor{height:30px;border-radius:999px;background:var(--veld);border:1px solid var(--lijn);overflow:hidden}
.rp-balk .vul{height:100%;border-radius:999px;background:linear-gradient(90deg,#8aa0bd,#b9c8db);width:var(--b);animation:rpBalk 1.4s cubic-bezier(.2,.8,.2,1) .3s both}
.rp-balk.kies .vul{background:linear-gradient(90deg,#22e3c4,#3b82f6,#8b5cf6)}
.rp-balk.kies b{color:var(--accent)}
.rp-balk .tijd{font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums;text-align:right}
@keyframes rpBalk{from{width:0}}
.rp-cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.rp-voet{font-size:13px;color:var(--zacht);text-align:center}
.rp-wacht{text-align:center;padding:50px 22px}
@media (max-width:760px){.rp-held{grid-template-columns:1fr;padding:26px 18px}.meter3d{height:260px}.rp-tegels{grid-template-columns:1fr 1fr}.rp-waarom{grid-template-columns:1fr}.rp-goed{columns:1}.rp-balk{grid-template-columns:54px 1fr 96px}}
@media (max-width:420px){.m3-chip.a{transform:translate(-160px,-110px) translateZ(80px)}.m3-chip.b{transform:translate(40px,-120px) translateZ(110px)}.m3-chip.c{transform:translate(30px,75px) translateZ(90px)}}
@media (prefers-reduced-motion:reduce){.meter3d-wereld,.m3-chip{animation:none}.m3-ring{animation:none;--sc:var(--doel)}.rp-balk .vul{animation:none}}
@media print{.kop,.rp-cta,body::before,body::after{display:none!important}body{background:#fff}.rp-held{box-shadow:none}.kaart{break-inside:avoid;box-shadow:none!important}.meter3d-wereld{animation:none}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>

<script>
// ---------- alle extra checks en de vergelijking met de concurrent (onderdelen: assets/rapport.js) ----------
// top 5, voor/na in Google en "noemt AI jou?" (Claude, met plafond; bij misbruik of plafond gewoon weggelaten)
async function rpAdvies(na, R) {
  const s = document.createElement("section"); s.className = "kaart"; na.before(s);
  const stop = rpLaden(s, "Ik schrijf je persoonlijke advies en vraag AI naar jouw bedrijf…");
  let x;
  try { const r = await fetch("https://dauvsivoxfdfzurmyuug.supabase.co/functions/v1/sr-tools", { method: "POST", headers: { "Content-Type": "application/json", "X-Sessie": (typeof sessieVan === "function" && sessieVan("beheer")) || "" }, body: JSON.stringify({ actie: "extra", id: q.get("id"), t: q.get("t") }) }); x = await r.json(); if (!r.ok) throw 0; } catch { x = null; }
  stop();
  if (!x || x.gratis) { s.remove(); return; }
  let h = "";
  if (x.ai?.length) {
    const n = x.ai.filter((a) => a.genoemd).length;
    h += `<h2>🤖 Noemt AI jou?</h2><p class="zacht" style="margin-top:-6px">We vroegen AI, net als een klant zou doen, om een bedrijf aan te raden.</p>
      <p style="font-size:20px;margin:6px 0 12px"><b>Je wordt ${n} van de ${x.ai.length} keer genoemd.</b></p>
      ${x.ai.map((a) => `<div class="rp-tool"><div class="rp-toolkop"><b>${R.e(a.vraag)}</b><span class="rp-door ${a.genoemd ? "sh" : "vb"}">${a.genoemd ? "✓ Jij wordt genoemd" : "✗ Jij wordt niet genoemd"}</span></div>
        <p class="zacht" style="margin:0">AI raadt aan: ${a.bedrijven.length ? a.bedrijven.map((b) => R.e(b.naam)).join(", ") : "geen bedrijven gevonden"}</p></div>`).join("")}
      ${n < x.ai.length ? `<p style="margin:10px 0 0">Met <b>Vindbaarheid</b> zorgen we dat AI-diensten jouw bedrijf leren kennen en aanraden.</p>` : ""}`;
  }
  if (x.top5?.length) h += `<h2 style="margin-top:${h ? "26px" : "0"}">⭐ Jouw top 5</h2><p class="zacht" style="margin-top:-6px">Als je maar 5 dingen aanpakt, doe dan deze.</p>
    <ol style="padding-left:20px;margin:6px 0 0">${x.top5.map((t) => `<li style="margin:8px 0"><b>${R.e(t.titel)}</b><br><span class="zacht">${R.e(t.uitleg)}</span></li>`).join("")}</ol>`;
  if (x.titel && x.oud && R.EXTRA["google-voorbeeld"]) h += `<h2 style="margin-top:26px">🔎 Zo kun je eruitzien in Google</h2><p class="zacht" style="margin-top:-6px">Een voorbeeld van wat wij voor je homepage zouden schrijven.</p>
    <div class="rp-wie-rij"><div style="display:block"><p class="label mono" style="margin:0 0 6px">Nu</p>${R.EXTRA["google-voorbeeld"](x.oud)}</div><div style="display:block"><p class="label mono" style="margin:0 0 6px">Met Vindbaarheid</p>${R.EXTRA["google-voorbeeld"]({ ...x.oud, titel: x.titel, omschrijving: x.omschrijving })}</div></div>`;
  s.innerHTML = h || ""; if (!h) s.remove();
  rpGidsen(s, R);
}
// sta je overal goed vermeld? (Google-bedrijfsprofiel en bedrijvengidsen)
async function rpGidsen(na, R) {
  const s = document.createElement("section"); s.className = "kaart"; (na.isConnected ? na : document.querySelector("#rpalles")).after(s);
  const stop = rpLaden(s, "Ik zoek op waar je bedrijf op internet vermeld staat…");
  let g; try { const r = await fetch("https://dauvsivoxfdfzurmyuug.supabase.co/functions/v1/sr-lokaal", { method: "POST", headers: { "Content-Type": "application/json", "X-Sessie": (typeof sessieVan === "function" && sessieVan("beheer")) || "" }, body: JSON.stringify({ actie: "check", id: q.get("id"), t: q.get("t") }) }); g = await r.json(); if (!r.ok) throw 0; } catch { g = null; }
  stop();
  if (!g || g.gratis || !g.gidsen) { s.remove(); return; }
  const w = g.website || {}, go = g.google || {}; const sc = (v) => String(v ?? "").replace(/<\/?cite[^>]*>/g, "");
  const regel = (x) => [x.naam, x.adres, x.telefoon].filter(Boolean).map((v) => R.e(sc(v))).join(" · ") || "–";
  s.innerHTML = `<h2>📍 Sta je overal goed vermeld?</h2><p class="zacht" style="margin-top:-6px">Google vertrouwt een bedrijf meer als naam, adres en telefoonnummer overal precies hetzelfde zijn.</p>
    <p style="margin:6px 0"><b>Op je website:</b> ${regel(w)}</p>
    <div class="rp-tool"><div class="rp-toolkop"><b>Google-bedrijfsprofiel (Google Maps)</b><span class="rp-door ${go.gevonden ? "sh" : "vb"}">${go.gevonden ? "✓ Gevonden" : "✗ Niet gevonden"}</span></div>
      <p class="zacht" style="margin:0">${go.gevonden ? regel(go) + (go.sterren ? ` · ${R.e(go.sterren)} sterren${go.reviews ? ` (${R.e(go.reviews)} reviews)` : ""}` : "") : "We vonden geen Google-bedrijfsprofiel. Daarmee verschijn je in Google Maps; het is gratis en voor lokale bedrijven het belangrijkst."}</p></div>
    ${g.gidsen.map((x) => `<div class="rp-tool"><div class="rp-toolkop"><b>${R.e(x.site)}</b><span class="rp-door ${x.gevonden && x.klopt ? "sh" : "vb"}">${!x.gevonden ? "Niet gevonden" : x.klopt ? "✓ Klopt" : "✗ Klopt niet"}</span></div>
      <p class="zacht" style="margin:0">${x.gevonden ? (x.klopt ? regel(x) : R.e(sc(x.verschil) || "Gegevens wijken af van je website.")) : "Je staat hier (nog) niet."}</p></div>`).join("")}
    <p style="margin:12px 0 0">${g.fout ? `<b>${g.fout} ${g.fout === 1 ? "vermelding klopt" : "vermeldingen kloppen"} niet.</b> ` : ""}Met <b>Vindbaarheid Plus</b> controleren we dit elk kwartaal en houden we je Google-bedrijfsprofiel actief met een bericht per week.</p>`;
}
async function rpExtra(d) {
  const el = document.createElement("section"); el.className = "kaart"; el.id = "rpalles";
  const anker = document.querySelector(".rp-advies"); anker.parentNode.insertBefore(el, anker);
  const stop = rpLaden(el, "Ik doe nog 14 extra checks op je site…"); el.insertAdjacentHTML("afterbegin", "<h2>Alle checks</h2>");
  let r;
  try {
    const x = await fetch("https://dauvsivoxfdfzurmyuug.supabase.co/functions/v1/sr-tools", { method: "POST", headers: { "Content-Type": "application/json", "X-Sessie": (typeof sessieVan === "function" && sessieVan("beheer")) || "" }, body: JSON.stringify({ actie: "rapport", id: q.get("id"), t: q.get("t") }) });
    r = await x.json(); if (!x.ok) throw new Error(r.fout || "");
    await rpLaadTools(); if (!window.SR_RENDER) throw new Error("");
  } catch (e) { stop(); el.remove(); return; }
  stop();
  const R = window.SR_RENDER, T = r.tools || {};
  el.innerHTML = `<h2>Alle checks</h2><p class="zacht" style="margin-top:-6px">Naast de controle van je pagina's hebben we je site op 14 onderdelen getest. Klik op een onderdeel voor de details.</p><div id="rpcats"></div>`;
  rpCategorieen(el.querySelector("#rpcats"), T);
  rpAdvies(el, R);
  // wie lost wat op + één knop
  const alle = Object.entries(T).flatMap(([t, u]) => (u.items || []).filter((i) => i.status !== "goed").map(() => u.door));
  const nvb = alle.filter((x) => x === "vb").length + (d.uitslag?.problemen || []).filter((p) => p.groep === "Inhoud" || p.groep === "AI-vindbaarheid").length;
  const nsh = alle.filter((x) => x === "sh").length + (d.uitslag?.problemen || []).filter((p) => p.groep === "Techniek" || p.groep === "Snelheid").length;
  const pk = (d.advies?.pakket && ["basis", "plus", "pro"].includes(d.advies.pakket)) ? d.advies.pakket : "basis";
  const link = `bestellen?${nvb ? "pakket=" + pk + "&" : "pakket=&"}${nsh ? "sh=1&" : ""}ref=check:${encodeURIComponent(q.get("id"))}`;
  const wie = document.createElement("section"); wie.className = "kaart rp-wie";
  wie.innerHTML = `<p class="label mono">Wie lost wat op</p><h2>${nvb + nsh} verbeterpunten, allemaal op te lossen</h2>
    <div class="rp-wie-rij"><div><b>${nvb}</b><span><b>Vindbaarheid</b> regelt de teksten en gegevens voor Google en AI: titels, omschrijvingen, beschrijvingen bij foto's en je bedrijfsgegevens. Jij keurt goed met één klik.</span></div>
    <div><b>${nsh}</b><span><b>Sitehulpje</b> regelt alles aan de website zelf: snelheid, beveiliging, links, je mail-instellingen en teksten op de pagina.</span></div></div>
    <p class="zacht" style="margin:4px 0 0">${nvb && nsh ? "Samen: Vindbaarheid vanaf €99 + Sitehulpje €75 per maand (in plaats van €125)." : nsh ? "Sitehulpje: €125 per maand." : "Vindbaarheid vanaf €99 per maand."} Prijzen excl. btw.</p>
    <div class="rp-cta"><a class="knop groot-knop" href="${link}">Laat Sitehulpje alles oplossen &rarr;</a></div>
    <p class="zacht" style="margin:8px 0 0;font-size:14px">Alle punten uit dit rapport gaan direct mee naar je account. Je hoeft niets opnieuw uit te leggen.</p>`;
  el.after(wie);
  // concurrent
  const vs = document.createElement("section"); vs.className = "kaart";
  vs.innerHTML = `<h2>🥊 Hoe sta je ervoor tegenover je concurrent?</h2><p class="zacht" style="margin-top:-6px">Vul de website van een concurrent in en zie per onderdeel wie er wint.</p><div data-sr-tool="concurrent" data-bron="check:${R.e(q.get("id"))}"></div>`;
  wie.after(vs);
  const veld = () => { const i = vs.querySelector("input[name=site]"); if (i) { i.value = d.site.replace(/^https?:\/\//, ""); i.closest("label").style.display = "none"; } };
  window.SR_START && window.SR_START(); veld();
  // concurrenten die bij de aanvraag gekozen of voorgesteld zijn: invullen en als knopjes tonen
  try {
