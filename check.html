<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gratis website-check – Sitehulpje</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="assets/icoon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{--bg:#eef4fb;--vlak:#fff;--tekst:#0b1a2e;--zacht:#5a6b82;--lijn:#d3deec;--accent:#0b9f8a;--blauw:#3b82f6;--paars:#7c4ddb;
  --hoog:#d63355;--hoogbg:rgba(214,51,85,.09);--middel:#b07000;--middelbg:rgba(255,183,0,.14);--laag:#4b6a8f;--laagbg:rgba(75,106,143,.1);--goed:#0b9f8a;--goedbg:rgba(11,159,138,.1);
  --donker:#0b1530;--schaduw:0 14px 34px -14px rgba(20,50,100,.22)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
body{color:var(--tekst);font:16px/1.6 "Space Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;padding:28px 16px 60px}
.vel{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.merk{font-weight:700;font-size:18px;text-decoration:none;color:var(--tekst)}.merk b{color:var(--accent);font-family:"JetBrains Mono",monospace;font-weight:600}
.blok{background:var(--vlak);border:1px solid var(--lijn);border-radius:18px;padding:22px;box-shadow:var(--schaduw)}
h1,h2,h3{text-wrap:balance;margin:0}
h1{font-size:clamp(26px,4.6vw,38px);line-height:1.1;letter-spacing:-.4px;word-break:break-word}
h2{font-size:21px;margin-bottom:10px}
.zacht{color:var(--zacht)}
.kop{background:radial-gradient(120% 140% at 90% 0%,rgba(124,77,219,.45),transparent 55%),radial-gradient(90% 120% at 0% 100%,rgba(34,227,196,.35),transparent 55%),var(--donker);color:#e6f1ff;border:0;display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center}
.kop .zacht{color:#a9bdd8}.kop .label{font-family:"JetBrains Mono",monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#22e3c4;margin:0 0 6px}
.kop p{margin:8px 0 0}
.meter{width:150px;aspect-ratio:1;max-width:100%;position:relative}
.meter svg{width:100%;height:100%;transform:rotate(-90deg)}
.meter .cijfer{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-family:"JetBrains Mono",monospace}
.meter b{font-size:40px;line-height:1;display:block}.meter small{font-size:12px;color:#a9bdd8}
.tegels{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.tegel{border:1px solid var(--lijn);border-radius:14px;padding:12px;min-width:0}
.tegel b{display:block;font-family:"JetBrains Mono",monospace;font-size:24px;font-variant-numeric:tabular-nums}
.tegel span{font-size:13px;color:var(--zacht)}
.tegel.slecht b{color:var(--hoog)}.tegel.matig b{color:var(--middel)}.tegel.goed b{color:var(--goed)}
.samen{font-size:17px;margin:0}
.lijst{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.pb{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;border:1px solid var(--lijn);border-radius:14px;padding:12px 14px}
.pb .ernst{grid-row:span 2;font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;align-self:start;margin-top:3px}
.pb.hoog .ernst{color:var(--hoog);background:var(--hoogbg)}.pb.middel .ernst{color:var(--middel);background:var(--middelbg)}.pb.laag .ernst{color:var(--laag);background:var(--laagbg)}
.pb b{font-weight:600}.pb p{margin:0;font-size:14.5px;color:var(--zacht)}.pb p em{font-style:normal;color:var(--tekst)}
.goedlijst{columns:2;column-gap:24px;padding-left:0;list-style:none;margin:0}
.goedlijst li{break-inside:avoid;padding:4px 0 4px 26px;position:relative;font-size:15px}
.goedlijst li::before{content:"✓";position:absolute;left:4px;color:var(--goed);font-weight:700}
.woord{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--lijn);padding:8px 0;font-size:15px}
.woord span{color:var(--zacht);text-align:right}.woord .ja{color:var(--goed)}.woord .nee{color:var(--hoog)}
.advies{background:linear-gradient(var(--vlak),var(--vlak)) padding-box,linear-gradient(135deg,var(--accent),var(--blauw) 55%,var(--paars)) border-box;border:1.5px solid transparent}
.advies .label{font-family:"JetBrains Mono",monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0 0 4px}
.advies h2{font-size:26px}
.waarom{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.waarom div{background:var(--goedbg);border-radius:12px;padding:12px;font-size:14.5px;min-width:0}
.waarom b{display:block;font-size:15px;margin-bottom:2px}
.tabel-wrap{overflow-x:auto;margin:10px 0 4px}
table{width:100%;border-collapse:collapse;font-size:14.5px;min-width:480px}
th,td{text-align:left;padding:10px;border-bottom:1px solid var(--lijn);vertical-align:top}
th{font-size:12px;font-family:"JetBrains Mono",monospace;letter-spacing:.05em;text-transform:uppercase;color:var(--zacht);font-weight:600}
td.num{font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.kies td{background:var(--goedbg)}tr.kies td:first-child{font-weight:700}
.tag{font-family:"JetBrains Mono",monospace;font-size:11px;padding:2px 7px;border-radius:999px;background:var(--accent);color:#fff;margin-left:6px;white-space:nowrap}
.knoppen{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.knop{display:inline-block;padding:12px 18px;border-radius:12px;font-weight:700;text-decoration:none;color:#04111a;background:linear-gradient(135deg,#22e3c4,#3b82f6)}
.knop.rand{background:transparent;color:var(--tekst);border:1px solid var(--lijn)}
.knop:focus-visible{outline:3px solid var(--blauw);outline-offset:2px}
.voet{font-size:13px;color:var(--zacht);text-align:center}
.wacht{text-align:center;padding:40px 22px}
.balk{position:sticky;top:0;z-index:3;display:flex;gap:10px;align-items:center;justify-content:space-between;margin:-28px -16px 0;padding:10px 16px;background:rgba(238,244,251,.9);backdrop-filter:blur(8px)}
.balk button{font:inherit;font-size:14px;border-radius:10px;border:1px solid var(--lijn);background:var(--vlak);padding:7px 12px;cursor:pointer}
@media (max-width:640px){.kop{grid-template-columns:1fr}.meter{width:120px}.tegels{grid-template-columns:1fr 1fr}.waarom{grid-template-columns:1fr}.goedlijst{columns:1}}
@media print{.balk,.knoppen{display:none}body{background:#fff;padding:0}.blok{box-shadow:none;break-inside:avoid}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>
<body>
<div class="balk"><a class="merk" href="/">Site<b>hulpje</b></a><button type="button" id="pdf">⬇ Bewaar als PDF</button></div>
<div class="vel" id="vel"><div class="blok wacht"><p class="zacht">Rapport laden…</p></div></div>
<script>
const API = "https://dauvsivoxfdfzurmyuug.supabase.co/functions/v1/vb-check";
const q = new URLSearchParams(location.search);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const nl = (n) => Number(n).toLocaleString("nl-NL");
const dat = (s) => new Date(s).toLocaleDateString("nl-NL", { day: "numeric", month: "long", year: "numeric" });
const PAKKET = { basis: ["Basis", 5, 99], plus: ["Plus", 15, 179], pro: ["Pro", 30, 249] };
const ERNST = { hoog: "Belangrijk", middel: "Middel", laag: "Kleiner" };
document.getElementById("pdf").onclick = () => window.print();

function opbouw(d) {
  const u = d.uitslag || {}, a = d.advies || {}, s = u.snelheid || {}, pb = u.problemen || [];
  const host = d.site.replace(/^https?:\/\//, "");
  const kleur = d.score >= 75 ? "#22e3c4" : d.score >= 50 ? "#ffb547" : "#ff6b81";
  const dash = (263.9 * (1 - Math.max(0, Math.min(100, d.score)) / 100)).toFixed(1);
  const alt = pb.find((p) => p.soort === "alt");
  const tegel = (klasse, waarde, tekst) => `<div class="tegel ${klasse}"><b>${waarde}</b><span>${tekst}</span></div>`;
  const tegels = [
    s.score != null ? tegel(s.score >= 75 ? "goed" : s.score >= 50 ? "matig" : "slecht", s.score, "snelheid op mobiel (van 100)") : "",
    s.lcp != null ? tegel(s.lcp <= 2.5 ? "goed" : s.lcp <= 4 ? "matig" : "slecht", String(s.lcp).replace(".", ",") + " s", "voordat het grootste beeld staat") : "",
    tegel(pb.filter((p) => p.ernst === "hoog").length ? "slecht" : "goed", pb.filter((p) => p.ernst === "hoog").length, "belangrijke punten"),
    alt ? tegel("matig", nl(alt.aantal), "afbeeldingen zonder beschrijving") : (s.seo != null ? tegel(s.seo >= 90 ? "goed" : "matig", s.seo, "SEO-basis volgens Google (van 100)") : ""),
  ].join("");
  const woorden = (d.gevonden?.woorden || []).map((w) => {
    const waar = [w.titel && "in de titel", w.kop && "in de hoofdkop", w.tekst && !w.titel && !w.kop && "in de tekst"].filter(Boolean);
    return `<div class="woord"><b>${esc(w.woord)}</b><span class="${waar.length ? "ja" : "nee"}">${waar.length ? "✓ op je homepage " + waar.join(" en ") : w.elders ? "alleen op een andere pagina" : "✗ niet gevonden op je homepage"}</span></div>`;
  }).join("");
  const plaats = d.plaats || d.gevonden?.plaats?.plaats;
  const p = PAKKET[a.pakket] || PAKKET.plus;
  const rij = (k) => { const [naam, per, prijs] = PAKKET[k]; return `<tr class="${k === a.pakket ? "kies" : ""}"><td>${naam}${k === a.pakket ? '<span class="tag">advies</span>' : ""}</td><td class="num">${per}</td><td class="num">${a.maanden?.[k] ? "± " + a.maanden[k] + " maand" + (a.maanden[k] > 1 ? "en" : "") : "–"}</td><td class="num">€${prijs}</td></tr>`; };
  const gebied = { plaatselijk: "plaatselijk", regionaal: "regionaal", landelijk: "in heel Nederland", internationaal: "ook internationaal" }[d.werkgebied];
  return `
  <section class="blok kop">
    <div><p class="label">Gratis website-check · ${dat(d.datum)}</p><h1>${esc(host)}</h1>
      <p class="zacht">We hebben ${nl(u.gecontroleerd || 0)}${u.sitemap_aantal > u.gecontroleerd ? " van je " + nl(u.sitemap_aantal) : ""} pagina's gecontroleerd op ruim 30 punten, en de snelheid op mobiel gemeten met de meetmethode van Google.</p></div>
    <div class="meter" role="img" aria-label="Score ${d.score} van 100"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="10"/><circle cx="50" cy="50" r="42" fill="none" stroke="${kleur}" stroke-width="10" stroke-linecap="round" stroke-dasharray="263.9" stroke-dashoffset="${dash}"/></svg>
      <div class="cijfer"><div><b>${d.score}</b><small>van 100</small></div></div></div>
  </section>
  <section class="blok"><h2>In het kort</h2><p class="samen">${esc(a.samenvatting || "")}</p><div class="tegels">${tegels}</div></section>
  ${woorden || gebied ? `<section class="blok"><h2>Waar je op gevonden wilt worden</h2>
    ${gebied ? `<p class="zacht" style="margin:0 0 8px">Je werkt ${gebied}${plaats ? ", vanuit <b>" + esc(plaats) + "</b>" : ""}.${!plaats && (d.werkgebied === "plaatselijk" || d.werkgebied === "regionaal") ? " We vonden je vestigingsplaats niet op je site." : ""}</p>` : ""}${woorden}</section>` : ""}
  <section class="blok"><h2>Wat we vonden</h2><ul class="lijst">
    ${pb.map((x) => `<li class="pb ${esc(x.ernst)}"><span class="ernst">${ERNST[x.ernst] || ""}</span><b>${esc(x.tekst)}</b><p><em>Oplossing:</em> ${esc(x.oplossing || "")}</p></li>`).join("") || '<li class="zacht">Geen problemen gevonden.</li>'}
  </ul></section>
  ${(u.goed || []).length ? `<section class="blok"><h2>Wat al goed gaat</h2><ul class="goedlijst">${u.goed.map((g) => `<li>${esc(g)}</li>`).join("")}</ul></section>` : ""}
  <section class="blok advies"><p class="label">Ons advies</p><h2>Vindbaarheid ${p[0]} past het best bij ${esc(d.bedrijf || host)}</h2>
    <p class="zacht" style="margin:6px 0 0">Dit advies volgt uit wat we op je site vonden, niet uit een vaste regel.</p>
    <div class="waarom">${(a.redenen || []).map((r) => `<div><b>${esc(r.kop)}</b>${esc(r.tekst)}</div>`).join("")}</div>
    ${a.werk ? `<h3 style="font-size:16px;margin-top:6px">Hoe snel het opknappen gaat, per pakket</h3>
    <p class="zacht" style="margin:4px 0 0;font-size:14.5px">Gerekend met de ${a.werk} pagina's met verbeterpunten uit deze check. Daarna gaan we verder met de rest van je site.</p>
    <div class="tabel-wrap"><table><thead><tr><th>Pakket</th><th>Pagina's per maand</th><th>${a.werk} pagina's klaar in</th><th>Prijs per maand</th></tr></thead><tbody>${["basis", "plus", "pro"].map(rij).join("")}</tbody></table></div>` : ""}
    <p class="zacht" style="margin:8px 0 0;font-size:14px">Met Sitehulpje webbeheer erbij kost dat €75 per maand in plaats van €125. Prijzen exclusief btw, minimaal 3 maanden.</p>
    <div class="knoppen"><a class="knop" href="vindbaarheid#pakketten">Start met ${p[0]}</a><a class="knop rand" href="vindbaarheid#pakketten">Bekijk alle pakketten</a></div>
  </section>
  <p class="voet">Sitehulpje · een dienst van Siteregelaar · Markt 9, 7551 CG Hengelo · info@sitehulpje.nl · 06 27 25 43 83<br>Niemand kan een plek bovenaan in Google garanderen. Resultaat zie je meestal na 2 tot 6 maanden.</p>`;
}

(async () => {
  const el = document.getElementById("vel");
  try {
    const r = await fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ actie: "toon", id: q.get("id"), t: q.get("t"), klant: q.get("k") === "1" }) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.fout || "Er ging iets mis.");
    if (d.status !== "klaar" && d.status !== "verstuurd") { el.innerHTML = `<div class="blok wacht"><h2>Je check loopt nog</h2><p class="zacht">We zijn je website aan het controleren. Dit duurt een paar minuten.</p></div>`; setTimeout(() => location.reload(), 20000); return; }
    document.title = `Website-check ${d.site.replace(/^https?:\/\//, "")} – Sitehulpje`;
    el.innerHTML = opbouw(d);
  } catch (e) { el.innerHTML = `<div class="blok wacht"><p>${esc(e.message)}</p></div>`; }
})();
</script>
</body>
</html>
