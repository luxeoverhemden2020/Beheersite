<!doctype html>
<html lang="nl">
<head>
<script>location.replace("portaal" + location.search + location.hash);</script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sitehulpje</title>
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sitehulpje">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="assets/stijl.css?v=20261110f">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="96x96" href="/assets/favicon-96.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
</head>
<body>
<div class="kop">
  <span class="bot-klein" id="kopbot"></span>
  <div class="merk">Site<b>hulpje</b><small id="site"></small></div>
  <div class="rechts"><button class="knop rand klein thema" type="button"></button><button class="knop rand klein" id="uit">Uitloggen</button></div>
</div>
<div class="wrap">
  <div id="appTip"></div>
  <div id="vbpauze"></div>
  <div id="shstart"></div>
  <div class="hooftabs verborgen" id="hooftabs"><button class="aan" data-hoofd="verzoeken">Verzoeken</button><button data-hoofd="vindbaarheid">Vindbaarheid</button></div>
  <div id="vindbaarheid" class="verborgen"></div>
  <div id="verzoekenDeel">
  <div class="kaart">
    <h2><span class="tag">&gt;_</span>Nieuw verzoek</h2>
    <p class="zacht" style="margin-top:0">Beschrijf wat er op je website moet veranderen. Je kunt ook inspreken, foto's toevoegen (of plakken) of een korte video sturen (max. 1 minuut).</p>
    <div class="snel" id="snel"></div>
    <div id="nieuw"></div>
    <div id="meld" class="verborgen"></div>
  </div>
  <div id="lijst"><p class="zacht">Laden…</p></div>
  </div>
  <div id="klussen" style="margin-top:28px"></div>
  <div id="vriend" style="margin-top:16px"></div>
  <div id="abonnement" style="margin-top:28px"></div>
</div>
<style>details.abonnement{opacity:.85}details.abonnement>summary{cursor:pointer;color:var(--zacht);font-size:14px}details.abonnement[open]{opacity:1}
.klus-lijst{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:10px}
.klus{border:1px solid var(--lijn);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.klus b{font-size:16px}.klus .prijs{font-family:var(--mono,monospace);font-weight:700}
.vb-aanbod{margin-top:10px;padding:14px;border-radius:14px;border:1px solid var(--lijn);background:var(--bg2)}
.vb-aanbod .rij{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.vriend-link{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}.vriend-link input{flex:1 1 220px;min-width:0;font-family:var(--mono,monospace);font-size:13px}</style>
<script src="assets/basis.js?v=20261113a"></script>
<script src="assets/vindbaarheid.js?v=20261112b"></script>
<script src="assets/vb-start.js?v=20261111a"></script>
<script src="assets/vb-site.js"></script>
<script src="assets/vb-factuur.js?v=20261112b"></script>
<script>
let open = new Set(), cache = {}, timer = null;
const SNELKNOPPEN = [
  ["💶", "Prijs aanpassen", "Pas de prijs aan van "],
  ["🏷️", "Sale / actie", "Zet een actie op de site: "],
  ["🛒", "Nieuw product", "Voeg dit nieuwe product toe (foto's erbij): "],
  ["🎟️", "Kortingscode", "Maak een kortingscode: "],
  ["🕘", "Openingstijden", "Pas de openingstijden aan: "],
  ["📢", "Melding bovenaan", "Zet een melding bovenaan de site: "],
  ["✍️", "Tekst aanpassen", "Pas deze tekst aan: "],
  ["📸", "Foto's", "Zet deze foto's op de site: "],
  ["🎬", "Video", "Zet deze video op de site: "],
  ["📰", "Nieuwsbericht", "Schrijf en plaats een nieuwsbericht over "],
  ["🔎", "Beter in Google", "Zorg dat deze pagina beter gevonden wordt in Google: "],
];

$("#uit").onclick = async () => { try { await api("uitloggen"); } catch {} zetSessie(""); location.href = "inloggen"; };

maakInvoer($("#nieuw"), {
  opVersturen: async (tekst, fotos) => {
    toonMelding($("#meld"), "");
    try {
      const r = await api("verzoek_nieuw", { tekst, fotos });
      open.add(r.id);
      if (r.melding) toonMelding($("#meld"), r.melding, "let");
      await laad();
    } catch (e) {
      toonMelding($("#meld"), e.message, e.message.includes("limiet") ? "let" : "fout");
      throw new Error("");
    }
  },
});

$("#snel").innerHTML = SNELKNOPPEN.map(([i, t], n) => `<button type="button" class="snelknop" data-n="${n}"><span>${i}</span>${t}</button>`).join("");
$("#snel").onclick = (e) => {
  const k = e.target.closest(".snelknop"); if (!k) return;
  const ta = $("#nieuw textarea"); const [, , start] = SNELKNOPPEN[k.dataset.n];
  ta.value = start; ta.focus(); ta.setSelectionRange(start.length, start.length);
  document.querySelectorAll(".snelknop").forEach((b) => b.classList.toggle("aan", b === k));
};

async function laadVerzoek(id) {
  const d = await api("verzoek", { id });
  cache[id] = d;
  return d;
}

// Voorstel op de testsite? Dan knoppen "Bekijk de testsite" en "Akkoord" tonen
function testLink(v, d) {
  if (v.status !== "wacht_op_klant" || !d) return "";
  const b = d.verzoek.berichten, laatste = b[b.length - 1];
  if (!laatste || laatste.van !== "webbeheer") return "";
  const m = String(laatste.tekst || "").match(/https?:\/\/[^\s)<>"']*-test\.vercel\.app[^\s)<>"']*/);
  return m ? m[0].replace(/[.,!?]+$/, "") : "";
}

function teken(lijst) {
  const el = $("#lijst");
  if (!lijst.length) { el.innerHTML = `<p class="zacht">Nog geen verzoeken. Je eerste verzoek verschijnt hier.</p>`; return; }
  el.innerHTML = lijst.map((v) => {
    const isOpen = open.has(v.id), d = cache[v.id], actief = ACTIEF.includes(v.status);
    return `<div class="verzoek${actief ? " actief" : ""}" data-id="${v.id}">
      ${actief ? `<div class="balk" aria-label="Bezig"></div>` : ""}
      <div class="hoofd"><span class="nr">#${v.nr}</span><span class="titel">${esc(v.onderwerp)}</span>
        <span class="chip ${v.status}">${STATUS[v.status]}</span></div>
      ${actief && !isOpen ? `<div style="padding:0 16px 4px">${wachtHtml(v.status, v.bijgewerkt)}</div>` : ""}
      ${isOpen && !d ? `<div class="lijf"><p class="zacht">Laden…</p></div>` : ""}
      ${isOpen && d ? `<div class="lijf">
        ${berichtenHtml(d.verzoek.berichten)}
        ${testLink(v, d) ? `<div class="testpaneel">
          <div class="tp-kop">${robotSvg("rust")}<div><div class="fase">&gt;_ klaar op de testsite</div>
            <div class="zacht">Bekijk het voorbeeld. Goed? Dan zet ik het met één klik op je echte website.</div></div></div>
          <div class="tp-knoppen">
            <a class="knop rand groot" href="${esc(testLink(v, d))}" target="_blank" rel="noopener">👀 Bekijk de testsite</a>
            <button class="knop groot akkoord">✓ Akkoord, zet het live</button></div></div>` : ""}
        ${actief ? wachtHtml(v.status, v.bijgewerkt) : ""}
        ${!actief && d.reacties_over > 0 ? `<div class="reactie" style="margin-top:12px"></div>` : ""}
        ${!actief && d.reacties_over === 0 ? `<p class="zacht">Dit gesprek is vol. Start hierboven een nieuw verzoek.</p>` : ""}
        ${v.status === "klaar" ? `<div class="rij" style="margin-top:8px"><button class="knop rand klein terug">↩ Deze aanpassing terugdraaien</button></div>` : ""}
        <div class="verborgen fout"></div>
      </div>` : ""}
    </div>`;
  }).join("");
  tikWacht();

  el.querySelectorAll(".verzoek").forEach((blok) => {
    const id = blok.dataset.id;
    $(".hoofd", blok).onclick = () => {
      if (open.has(id)) { open.delete(id); teken(lijst); return; }
      open.add(id); teken(lijst);                       // direct openen
      laadVerzoek(id).then(() => { if (open.has(id)) teken(lijst); }).catch(() => {});  // daarna verversen
    };
    const r = $(".reactie", blok);
    if (r) maakInvoer(r, {
      plaats: "Reageer of geef een aanvulling…", knop: "Reageren",
      opVersturen: async (tekst, fotos) => { await api("reageer", { id, tekst, fotos }); await laad(); },
    });
    const ak = $(".akkoord", blok);
    if (ak) ak.onclick = async () => {
      ak.disabled = true; ak.textContent = "Bezig…";
      try { await api("reageer", { id, tekst: "Akkoord, zet het maar live." }); await laad(); }
      catch (e) { ak.disabled = false; ak.textContent = "✓ Akkoord, zet het live"; toonMelding($(".fout", blok), e.message); }
    };
    const t = $(".terug", blok);
    if (t) t.onclick = async () => {
      if (!confirm("Weet je zeker dat je deze aanpassing wilt terugdraaien?")) return;
      try { await api("terugdraaien", { id }); await laad(); }
      catch (e) { toonMelding($(".fout", blok), e.message); }
    };
  });
}

let laatsteLijst = [];
async function laad(geforceerd = true) {
  clearTimeout(timer);
  try {
    const { verzoeken } = await api("verzoeken_lijst");
    // open blokken verversen
    await Promise.all([...open].filter((id) => verzoeken.some((v) => v.id === id)).map((id) => laadVerzoek(id).catch(() => {})));
    const veranderd = JSON.stringify(verzoeken) !== JSON.stringify(laatsteLijst);
    const typt = [...document.querySelectorAll(".reactie textarea")].some((t) => t.value.trim()) ||
      (document.activeElement && document.activeElement.closest(".reactie"));
    if (geforceerd || (veranderd && !typt)) teken(verzoeken);
    laatsteLijst = verzoeken;
    verzoeken.slice(0, 8).filter((v) => !cache[v.id]).forEach((v) => laadVerzoek(v.id).catch(() => {}));
    const iemandActief = verzoeken.some((v) => ACTIEF.includes(v.status));
    timer = setTimeout(() => laad(false), iemandActief ? 4000 : 30000);
  } catch (e) {
    timer = setTimeout(() => laad(false), 15000);
  }
}

$("#kopbot").innerHTML = robotSvg("rust");
// Alleen Sitehulpje besteld? Dan eerst één stap: ons toegang geven tot de website.
async function shStart(el) {
  const SB = API.replace(/beheersite$/, "vb-bestel");
  const vraag = async (actie, data = {}) => { const r = await fetch(SB, { method: "POST", headers: { "Content-Type": "application/json", "X-Sessie": sessie() }, body: JSON.stringify({ actie, ...data }) });
    const d = await r.json().catch(() => ({})); if (!r.ok) throw new Error(d.fout || "Er ging iets mis."); return d; };
  let d; try { d = await vraag("sh_status"); } catch { return; }
  if (!d.nodig) { el.innerHTML = ""; return; }
  el.innerHTML = `<div class="kaart" style="border-left:4px solid var(--accent)">
    <h2 style="margin:0 0 6px"><span class="tag">1</span>Koppel je website</h2>
    <p style="margin:0 0 10px">Om je website te kunnen aanpassen moet Sitehulpje erbij kunnen. Je eigen wachtwoord hoef je nooit te delen.</p>
    <div data-vbsite></div></div>`;
  vbSiteToon(el.querySelector("[data-vbsite]"), undefined, {});
}
api("ik").then((d) => {
  if (d.gebruiker.rol === "admin" && !d.klant) { location.href = "beheer"; return; }
  $("#site").textContent = d.klant ? `${d.klant.naam} · ${d.klant.site.replace(/^https?:\/\//, "")}` : "";
  laad();
  appTip($("#appTip"));
  // Vindbaarheid: alleen als de klant dit pakket heeft
  if (d.klant) { vbfPauzeMelding($("#vbpauze")); vbfOpzegKlant($("#abonnement")); shStart($("#shstart")); vbfKlussen($("#klussen")); vbfVriend($("#vriend")); }
  // Geen Vindbaarheid (en niet op pauze)? Laat dan een tab zien met uitleg en een link naar de pakketten.
  const vbPromo = () => vbfApi("status").then((p) => {
    if (p.pauze || !d.klant) return;
    const tabs = $("#hooftabs"); tabs.classList.remove("verborgen");
    tabs.querySelector('[data-hoofd="vindbaarheid"]').innerHTML = 'Vindbaarheid <span class="vbs-label" style="margin-left:4px">nieuw</span>';
    $("#vindbaarheid").innerHTML = `<div class="kaart" style="margin-top:12px">
      <h2 style="margin:0 0 6px">Beter gevonden worden in Google én AI</h2>
      <p class="zacht" style="margin:0 0 10px">Met Vindbaarheid controleren we je website elke week, verbeteren we je teksten voor Google en zie je in een helder dashboard hoe vaak je gevonden wordt. Ook in ChatGPT en andere AI-diensten.</p>
      <ul class="vb-goed" style="margin-bottom:12px"><li>Elke week een website-check</li><li>Betere titels en omschrijvingen, jij keurt goed met één klik</li><li>Je cijfers uit Google en Bing</li><li>Elke maand een rapport in gewone taal</li></ul>
      <p style="margin:0 0 12px"><b>In een pakket met Sitehulpje vanaf €169 per maand.</b> <span class="zacht">Je website laten aanpassen zit erin. Eerste jaar 10% korting.</span></p>
      <a class="knop" href="/#prijs">Bekijk de pakketten</a></div>`;
    const kies = (t) => {
      tabs.querySelectorAll("button").forEach((b) => b.classList.toggle("aan", b.dataset.hoofd === t));
      $("#verzoekenDeel").classList.toggle("verborgen", t !== "verzoeken");
      $("#vindbaarheid").classList.toggle("verborgen", t !== "vindbaarheid");
    };
    tabs.querySelectorAll("button").forEach((b) => (b.onclick = () => kies(b.dataset.hoofd)));
  }).catch(() => {});
  vbApi("status").then((s) => {
    if (!s.klant.aan) return vbPromo();
    const tabs = $("#hooftabs"); tabs.classList.remove("verborgen");
    let geladen = false;
    const kies = (t) => {
      tabs.querySelectorAll("button").forEach((b) => b.classList.toggle("aan", b.dataset.hoofd === t));
      $("#verzoekenDeel").classList.toggle("verborgen", t !== "verzoeken");
      $("#vindbaarheid").classList.toggle("verborgen", t !== "vindbaarheid");
      $(".wrap").classList.toggle("breed", t === "vindbaarheid");
      if (t === "vindbaarheid" && !geladen) { geladen = true; vbMetStart($("#vindbaarheid")); }
      try { history.replaceState(null, "", location.pathname + location.search + (t === "vindbaarheid" ? "#vindbaarheid" : "")); } catch {}
    };
    tabs.querySelectorAll("button").forEach((b) => (b.onclick = () => kies(b.dataset.hoofd)));
    if (location.hash === "#vindbaarheid" || new URLSearchParams(location.search).get("google")) kies("vindbaarheid");
    // nieuwe klant: zolang de startstappen niet af zijn, meteen naar Vindbaarheid
    vbsApi("status").then((st) => {
      if (st.klant_klaar) return;
      tabs.querySelector('[data-hoofd="vindbaarheid"]').innerHTML = 'Vindbaarheid <span class="vbs-label" style="margin-left:4px">start</span>';
      kies("vindbaarheid");
    }).catch(() => {});
  }).catch((e) => { if (/staat niet aan/.test(e.message || "")) vbPromo(); });
});
</script>
</body>
</html>
