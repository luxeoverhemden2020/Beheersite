<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Factuur – Sitehulpje</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{--tekst:#0b1a2e;--zacht:#5a6b82;--lijn:#d3deec;--accent:#0b9f8a;--accent2:rgba(11,159,138,.1);--fout:#d63355;--vlak:#f5f8fc}
*{box-sizing:border-box}
html,body{background:#e9eef5;margin:0}
body{color:var(--tekst);font:15px/1.55 "Space Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif}
.balk{position:sticky;top:0;z-index:3;background:#0b1220;color:#fff;padding:10px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.balk .merk{font-weight:700}.balk .merk b{color:#22e3c4;font-family:"JetBrains Mono",monospace;font-weight:600}
.balk .vul{flex:1}
.balk button,.balk a{font:inherit;font-size:14px;border-radius:10px;border:1px solid #2b3d5c;background:#16213a;color:#fff;padding:7px 12px;cursor:pointer;text-decoration:none}
.balk .hoofd{background:linear-gradient(135deg,#22e3c4,#3b82f6);color:#04111a;border:0;font-weight:700}
.vel{max-width:820px;margin:20px auto;background:#fff;padding:44px;box-shadow:0 10px 30px rgba(15,40,80,.12);border-radius:6px}
.kop{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;border-bottom:3px solid var(--accent);padding-bottom:16px;margin-bottom:24px}
.kop h1{font-size:30px;margin:0;letter-spacing:-.3px}
.logo{font-weight:700;font-size:18px;text-align:right}.logo b{color:var(--accent);font-family:"JetBrains Mono",monospace;font-weight:600}.logo small{display:block;font-weight:400;font-size:12px;color:var(--zacht);line-height:1.5}
.partijen{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px}
.partijen h3,.gegevens h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--zacht);margin:0 0 4px;font-weight:600}
.gegevens{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;background:var(--vlak);border-radius:8px;padding:12px 16px;margin-bottom:24px}
.mono{font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font-size:12px;color:var(--zacht);font-weight:600;border-bottom:1px solid var(--lijn);padding:8px}
td{border-bottom:1px solid var(--lijn);padding:10px 8px;vertical-align:top}
.r{text-align:right}
.som{margin-left:auto;width:min(100%,320px);margin-top:10px}
.som div{display:flex;justify-content:space-between;padding:5px 8px}
.som .tot{border-top:2px solid var(--tekst);font-weight:700;font-size:17px;margin-top:4px;padding-top:8px}
.betaal{margin-top:26px;padding:12px 16px;border-left:4px solid var(--accent);background:var(--accent2);border-radius:6px}
.stempel{display:inline-block;font:700 13px "JetBrains Mono",monospace;text-transform:uppercase;letter-spacing:.08em;border:2px solid currentColor;border-radius:6px;padding:3px 10px;margin-top:6px}
.stempel.betaald{color:var(--accent)}.stempel.concept{color:#a86b00}.stempel.open,.stempel.teruggeboekt,.stempel.mislukt{color:var(--fout)}
.voet{margin-top:34px;border-top:1px solid var(--lijn);padding-top:12px;font-size:12px;color:var(--zacht)}
.zacht{color:var(--zacht)}
@media (max-width:640px){.vel{padding:22px 16px;margin:0;border-radius:0}.partijen,.gegevens{grid-template-columns:1fr}.kop{flex-direction:column}.logo{text-align:left}}
@media print{html,body{background:#fff}.balk{display:none}.vel{box-shadow:none;margin:0;max-width:none;padding:0}@page{size:A4;margin:18mm 16mm}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="96x96" href="/assets/favicon-96.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
</head>
<body>
<div class="balk"><span class="merk">Site<b>hulpje</b></span><span class="vul"></span>
  <button class="hoofd" id="pdf" type="button">⬇ Download als PDF</button><a id="terug" href="verzoeken#vindbaarheid">Terug</a></div>
<div class="vel" id="vel"><p class="zacht">Factuur laden…</p></div>
<script>
const API = "https://dauvsivoxfdfzurmyuug.supabase.co/functions/v1/vb-factuur";
const p = new URLSearchParams(location.search);
const BEHEER = p.get("beheer") === "1";
const token = (() => { try { return localStorage.getItem(BEHEER ? "bs_sessie_beheer" : "bs_sessie") || ""; } catch { return ""; } })();
if (BEHEER) document.getElementById("terug").href = "beheer";
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const euro = (n) => "€ " + Number(n).toLocaleString("nl-NL", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const dat = (s) => new Date(s).toLocaleDateString("nl-NL", { day: "numeric", month: "long", year: "numeric" });
document.getElementById("pdf").onclick = () => window.print();

(async () => {
  const el = document.getElementById("vel");
  try {
    const publiek = !!p.get("t"); // link uit de factuurmail: bekijken zonder inloggen
    if (publiek) document.getElementById("terug").href = "./";
    const r = await fetch(API, { method: "POST", headers: { "Content-Type": "application/json", "X-Sessie": publiek ? "" : token }, body: JSON.stringify(publiek ? { actie: "toon_publiek", id: p.get("id"), t: p.get("t") } : { actie: "toon", id: p.get("id") }) });
    const d = await r.json().catch(() => ({}));
    if (r.status === 401) { location.href = BEHEER ? "inloggen?voor=beheer" : "inloggen"; return; }
    if (!r.ok) throw new Error(d.fout || "Er ging iets mis.");
    const f = d.factuur, k = f.gegevens.klant || {}, v = f.gegevens.verkoper || {};
    const stempel = { betaald: "Betaald", concept: "Concept", open: "Open", teruggeboekt: "Teruggeboekt", mislukt: "Niet betaald" }[f.status] || f.status;
    document.title = `Factuur ${f.nummer || "concept"} – Sitehulpje`;
    const betaaltekst = f.status === "betaald" ? `Betaald op ${dat(f.betaald)}${f.betaald_via === "incasso" ? " via automatische incasso" : ""}. Dank je wel!`
      : f.status === "concept" ? "Dit is een concept. Er wordt niets afgeschreven."
      : ["teruggeboekt", "mislukt"].includes(f.status) ? `Deze factuur staat nog open.${f.betaallink ? ` <a href="${esc(f.betaallink)}">Betaal hier</a>.` : ""}`
      : "Dit bedrag wordt binnen enkele werkdagen automatisch van je rekening afgeschreven. Je hoeft zelf niets te doen.";
    el.innerHTML = `
      <div class="kop"><div><h1>Factuur</h1><span class="stempel ${esc(f.status)}">${esc(stempel)}</span></div>
        <div class="logo">Site<b>hulpje</b><small>${esc(v.naam)}<br>${esc(v.adres)}<br>${esc(v.postcode)} ${esc(v.plaats)}<br>${esc(v.email)}</small></div></div>
      <div class="partijen">
        <div><h3>Aan</h3><b>${esc(k.naam)}</b>${k.contact ? `<br>t.a.v. ${esc(k.contact)}` : ""}${k.straat ? `<br>${esc(k.straat)}` : ""}${k.postcode || k.plaats ? `<br>${esc(k.postcode)} ${esc(k.plaats)}` : ""}${k.btw ? `<br><span class="zacht">Btw: ${esc(k.btw)}</span>` : ""}</div>
        <div><h3>Van</h3><b>${esc(v.naam)}</b><br>KvK ${esc(v.kvk)}<br>Btw ${esc(v.btw)}</div></div>
      <div class="gegevens">
        <div><h3>Factuurnummer</h3><span class="mono">${esc(f.nummer || "concept")}</span></div>
        <div><h3>Datum</h3>${dat(f.datum)}</div>
        <div><h3>Periode</h3>${esc(new Date(f.periode + "-15").toLocaleDateString("nl-NL", { month: "long", year: "numeric" }))}</div></div>
      <table><thead><tr><th>Omschrijving</th><th class="r">Bedrag</th></tr></thead>
        <tbody><tr><td>${esc(f.omschrijving)}</td><td class="r mono">${euro(f.bedrag_excl)}</td></tr></tbody></table>
      <div class="som mono"><div><span>Subtotaal</span><span>${euro(f.bedrag_excl)}</span></div><div><span>Btw 21%</span><span>${euro(f.btw)}</span></div>
        <div class="tot"><span>Totaal</span><span>${euro(f.totaal)}</span></div></div>
      <div class="betaal">${betaaltekst}</div>
      <div class="voet">${esc(v.naam)} · ${esc(v.adres)}, ${esc(v.postcode)} ${esc(v.plaats)} · KvK ${esc(v.kvk)} · Btw ${esc(v.btw)} · ${esc(v.email)}<br>
        Op deze factuur zijn de <a href="voorwaarden">algemene voorwaarden</a> van toepassing.</div>`;
  } catch (e) { el.innerHTML = `<p>${esc(e.message)}</p>`; }
})();
</script>
</body>
</html>
