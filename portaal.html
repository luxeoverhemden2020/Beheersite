<style>
body{background:var(--bg)}
.kp{display:flex;min-height:100vh}
.kp-zij{width:252px;flex:none;background:#0b1626;color:#e6f1ff;padding:18px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow-y:auto;box-sizing:border-box;z-index:20}
.kp-merk{display:flex;align-items:center;gap:9px;padding:2px 8px;font-family:"Space Grotesk",system-ui,sans-serif;font-weight:700;font-size:17px}
.kp-merk b{color:#22e3c4}.kp-merk .bot-klein{width:30px;height:30px}
.kp-sluit{display:none;margin-left:auto;background:none;border:0;color:#9fb0c8;font-size:20px;cursor:pointer}
.kp-site{padding:2px 8px 14px;color:#7f93af;font-size:12.5px;line-height:1.35}
.kp-nav{display:flex;flex-direction:column;gap:2px}
.kp-item,.kp-sub{display:flex;align-items:center;gap:12px;border:0;background:none;color:#9fb0c8;font:500 15px "Inter",system-ui,sans-serif;cursor:pointer;text-align:left;border-radius:12px;padding:10px 12px}
.kp-item:hover,.kp-sub:hover{background:rgba(255,255,255,.05);color:#fff}
.kp-item.open{color:#fff;font-weight:700}.kp-item.open svg{stroke:#22e3c4}
.kp-item.aan{background:rgba(34,227,196,.12);box-shadow:inset 3px 0 0 #22e3c4;color:#fff;font-weight:700}.kp-item.aan svg{stroke:#22e3c4}
.kp-sub{margin-left:30px;padding:8px 12px;font-size:14px;color:#8aa0bd;border-radius:10px}
.kp-sub.aan{background:rgba(34,227,196,.12);color:#fff;font-weight:700}
.kp-item svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.kp-pijl{font-size:11px;color:#7f93af}
.kp-teller{background:#22e3c4;color:#04111a;font-size:11.5px;font-weight:700;border-radius:999px;padding:1px 8px}
.kp-streep{height:1px;background:#1f2f4a;margin:8px 6px}
.kp-vul{flex:1;min-width:0}
.kp-onder{display:flex;align-items:center;gap:8px;padding:14px 6px 0;margin-top:10px;border-top:1px solid #1f2f4a}
.kp-onder .thema{background:transparent!important;border:0!important;box-shadow:none!important;padding:4px 6px;font-size:16px}
.kp-uit{background:none;border:0;color:#9fb0c8;font:inherit;font-size:14px;cursor:pointer}.kp-uit:hover{color:#fff}
.kp-hoofd{flex:1;min-width:0;display:flex;flex-direction:column}
.kp-boven{display:none}
.kp-main{padding:30px 40px 48px;max-width:1100px;width:100%;box-sizing:border-box}
.kp-titel{margin-bottom:18px}.kp-titel h1{margin:0;font-size:30px;letter-spacing:-.02em}.kp-titel p{margin:6px 0 0;max-width:720px;line-height:1.55;font-size:15.5px}
[data-kp]{display:none}
.kp .vb-label-chip{display:none}
#vindbaarheid [data-vb-paneel]{display:none!important}
#vindbaarheid .vb-tabs{display:none}
.kp-held{display:flex;flex-direction:column;gap:12px;background:linear-gradient(135deg,var(--kaart),var(--accent2))}
.kp-held h2{margin:0;font-size:28px;letter-spacing:-.02em}.kp-held p{margin:0;font-size:16px;line-height:1.6;max-width:780px}
.kp-mono{font:500 12.5px ui-monospace,monospace;color:var(--accent)}
.kp-tegels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:14px}
.kp-held .kp-tegels{margin-bottom:0}
/* ---- Advertenties (Siteregelaar-stijl) ---- */
#kpads{display:none;flex-direction:column;gap:16px}
body[data-pagina="advertenties"] #kpads{display:flex}
#kpads .kaart{margin:0;padding:22px;border-radius:16px;display:flex;flex-direction:column;gap:12px}
#kpads h2{margin:0;font-size:19px;letter-spacing:-.01em}
#kpads p{margin:0}
.ad-mono{font:500 12.5px/1.3 "JetBrains Mono",ui-monospace,monospace;letter-spacing:.3px;color:var(--accent)}
.ad-held{gap:20px!important;background:linear-gradient(135deg,var(--kaart),var(--accent2))!important;padding:26px!important}
.ad-kop{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start;justify-content:space-between}
.ad-kop>div{display:flex;flex-direction:column;gap:6px;min-width:0}
.ad-held h1{margin:0;font-size:clamp(26px,3.4vw,36px);line-height:1.12;letter-spacing:-.02em;max-width:720px}
.ad-held .ad-uitleg{color:var(--zacht);font-size:15.5px;line-height:1.6;max-width:680px}
.ad-cijfers{display:flex;flex-wrap:wrap;align-items:center;gap:14px 26px}
.ad-g{display:flex;flex-direction:column;gap:4px}
.ad-g b{font:700 clamp(36px,4.6vw,48px)/1 "Space Grotesk",system-ui,sans-serif;letter-spacing:-.02em}
.ad-g b.glans{font-size:clamp(44px,5.6vw,60px)}
.ad-g span{color:var(--zacht);font-size:14px}
.glans,.ad-pijl{background:linear-gradient(90deg,#14c9ac,#3b82f6,#8b5cf6);-webkit-background-clip:text;background-clip:text;color:transparent}
.ad-pijl{font-size:30px}
.ad-pil{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:6px 11px;border-radius:999px;white-space:nowrap;background:var(--accent2);color:var(--accent)}
.ad-pil.groot{font-size:14px;padding:8px 14px}
.ad-pil.grijs{background:var(--bel);color:var(--zacht);border:1px solid var(--lijn)}
.ad-pil.let{background:var(--letbg);color:var(--let)}
.ad-pil.ok:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.ad-twee{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px}
.ad-rij{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--lijn);font-size:15px}
.ad-rij:last-child{border-bottom:0}
.ad-rij .zacht{margin:0;font-size:14px}
.ad-vinken{display:flex;flex-direction:column;gap:12px}
.ad-vink{display:flex;gap:12px;align-items:flex-start;font-size:15px;line-height:1.5}
.ad-vink>i{width:22px;height:22px;flex:none;border-radius:50%;background:var(--accent2);display:inline-flex;align-items:center;justify-content:center;margin-top:1px}
.ad-vink>i svg{width:12px;height:12px;fill:none;stroke:var(--accent);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.ad-vink .zacht{display:block;margin:2px 0 0;font-size:14px}
.ad-bron{display:flex;flex-direction:column;gap:6px}
.ad-bron>div:first-child{display:flex;justify-content:space-between;gap:10px;font-size:15px}
.ad-baan{height:8px;border-radius:8px;background:var(--lijn);overflow:hidden}
.ad-baan i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,#22e3c4,#3b82f6)}
.ad-balken{display:flex;align-items:flex-end;gap:6px;height:120px;margin-top:4px}
.ad-balk{flex:1;max-width:64px;display:flex;gap:2px;align-items:flex-end;height:100%}
.ad-balk i{flex:1;border-radius:4px 4px 0 0;min-height:2px}.ad-balk i.k{background:var(--lijn)}.ad-balk i.w{background:linear-gradient(180deg,#22e3c4,#3b82f6)}
.ad-details{display:grid;grid-template-columns:1fr 1fr;column-gap:40px}
.ad-klein{color:var(--zacht);font-size:13px;line-height:1.5}
.ad-voor{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.ad-voor>div{border:1px dashed var(--lijn);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:6px;background:var(--bel)}
.ad-voor b{font:700 15px "Space Grotesk",system-ui,sans-serif}
.ad-voor span{color:var(--zacht);font-size:14px;line-height:1.5}
.ad-voor em{font:700 28px/1 "Space Grotesk",system-ui,sans-serif;font-style:normal;color:var(--lijn)}
.ad-leeg b{color:#b8c6d8}
.ad-leeg .ad-pijl{background:none;color:#c9d6ea;-webkit-text-fill-color:#c9d6ea}
.ad-stappen{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px;counter-reset:st}
.ad-stappen li{counter-increment:st;display:grid;grid-template-columns:32px 1fr;column-gap:12px;row-gap:2px;font-size:15px;line-height:1.5}
.ad-stappen li:before{content:counter(st);grid-row:span 2;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:700 14px "Space Grotesk",system-ui,sans-serif;color:#063a33;background:linear-gradient(135deg,#e3fcf6,#e6eeff) padding-box,linear-gradient(135deg,#22e3c4,#3b82f6) border-box;border:1.5px solid transparent;box-sizing:border-box}
.ad-stappen span{color:var(--zacht);font-size:14px}
.ad-keuzes{display:flex;flex-direction:column;gap:8px}.ad-keuzes.rij3{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.ad-keuze{display:flex;align-items:center;gap:10px;padding:13px 14px;border-radius:12px;border:1.5px solid var(--lijn);background:#fff;cursor:pointer;font-size:15px}
.ad-keuze input{accent-color:#0b9f8a;width:18px;height:18px;margin:0;flex:none}
.ad-keuze:has(input:checked){border-color:#22e3c4;box-shadow:0 0 0 4px rgba(34,227,196,.12);font-weight:700}
.ad-veld{display:flex;flex-direction:column;gap:6px;font-size:13.5px;color:var(--zacht)}
.ad-veld input,.ad-veld textarea{font:inherit;font-size:15px;padding:12px 14px;color:var(--tekst)}
.ad-binnen{border-left:4px solid #22e3c4}
.ad-advs{display:grid;align-items:start;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:14px}
.ad-adv{border:1px solid var(--lijn);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;background:#fff}
.ad-adv.uit{opacity:.5}
.ad-adv-kop{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px}
.ad-schakel{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--zacht);cursor:pointer}.ad-schakel input{accent-color:#0b9f8a;width:16px;height:16px;margin:0}
.ad-google{display:flex;flex-direction:column;gap:4px;font-family:Arial,Helvetica,sans-serif;padding:12px 14px;border-radius:10px;background:var(--bel);min-height:110px}
.ad-g-spons{font-size:12px;font-weight:700;color:#202124}.ad-g-url{font-size:13px;color:#202124}
.ad-g-kop{font-size:18px;line-height:1.3;color:#1a0dab}.ad-g-tekst{font-size:14px;line-height:1.5;color:#4d5156}
.ad-pas summary{cursor:pointer;font-size:14px;font-weight:600;color:var(--accent)}
.ad-pas[open]{display:flex;flex-direction:column;gap:8px}.ad-pas[open] summary{margin-bottom:2px}
.ad-teller{font-size:12px;color:var(--zacht);justify-self:end}
.ad-pas .ad-veld{display:grid;grid-template-columns:1fr auto;gap:4px 8px;align-items:end}.ad-pas .ad-veld input,.ad-pas .ad-veld textarea{grid-column:1/-1}
.ad-woorden{display:flex;flex-direction:column}
.ad-woord{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--lijn);cursor:pointer;font-size:15px}.ad-woord:last-child{border-bottom:0}
.ad-woord input{accent-color:#0b9f8a;width:18px;height:18px;margin:2px 0 0;flex:none}
.ad-woord>span{display:flex;flex-direction:column;gap:2px}.ad-woord .zacht{font-size:13px}
.ad-knoppen{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ad-kies{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.ad-terug{background:none;border:0;padding:6px 0;font:600 14px "Inter",system-ui,sans-serif;color:var(--accent);cursor:pointer}
.ad-tabs{display:inline-flex;gap:4px;padding:4px;border-radius:12px;background:var(--bg2);border:1px solid var(--lijn)}
.ad-tabs button{border:0;background:none;padding:8px 14px;border-radius:9px;font:600 14px "Inter",system-ui,sans-serif;color:var(--zacht);cursor:pointer}
.ad-tabs button[aria-selected=true]{background:var(--accent2);color:var(--tekst);box-shadow:inset 0 0 0 1.5px rgba(34,227,196,.55)}
.ad-scroll{overflow-x:auto;margin:0 -4px}
.ad-tabel{width:100%;border-collapse:collapse;font-size:14.5px}
.ad-tabel th,.ad-tabel td{padding:11px 8px;border-bottom:1px solid var(--lijn);text-align:right;white-space:nowrap}
.ad-tabel th:first-child,.ad-tabel td:first-child{text-align:left;white-space:normal}
.ad-tabel th{font:600 12.5px "Inter",system-ui,sans-serif;text-transform:none;letter-spacing:0;color:var(--zacht)}
.ad-tabel tr:last-child td{border-bottom:0}
@media (max-width:860px){.ad-details,.ad-voor{grid-template-columns:1fr}.ad-held{padding:20px!important}#kpads .kaart{padding:18px}}
.kp-tegel{background:var(--bg2);border:1px solid var(--lijn);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.kp-tegel b{font:700 40px/1 "Space Grotesk",system-ui,sans-serif;letter-spacing:-.02em}
.kp-tegel span{font-size:13.5px}.kp-goed{color:var(--accent);font-weight:600}
.kp-twee{display:grid;grid-template-columns:1.3fr 1fr;gap:14px}
.kp-twee h3,.kaart h3{margin:0 0 10px;font-size:18px}
.kp-taak{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:12px;background:var(--accent2);border:1px solid var(--lijn);margin-bottom:8px;flex-wrap:wrap}
.kp-taak>span{font-size:20px}.kp-taak .kp-vul{display:flex;flex-direction:column;gap:3px;flex:1 1 200px}.kp-taak .zacht{font-size:14px}
.kp-vinken{list-style:none;padding:0;margin:0 0 12px;display:flex;flex-direction:column;gap:8px}
.kp-vinken li:before{content:"✓";display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--accent2);color:var(--accent);font-size:12px;font-weight:700;margin-right:10px}
.kp-auto{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:14px;background:#0b1626;color:#c9d6ea;margin-top:6px}
.kp-auto .bot-klein{width:26px;height:26px;flex:none}.kp-auto div{display:flex;flex-direction:column;gap:3px;font-size:14.5px;line-height:1.5}.kp-auto b{color:#22e3c4;font-size:13px}
.kp-dek{display:none}
@media (max-width:860px){
  .kp-zij{position:fixed;left:0;top:0;bottom:0;width:300px;transform:translateX(-105%);transition:transform .25s ease;background:var(--bg2);color:var(--tekst);box-shadow:12px 0 40px rgba(0,0,0,.25)}
  .kp-menu-open .kp-zij{transform:none}
  .kp-menu-open .kp-dek{display:block;position:fixed;inset:0;background:rgba(7,11,20,.55);z-index:15}
  .kp-sluit{display:block}
  .kp-item,.kp-sub{color:var(--zacht)}.kp-item.open,.kp-item.aan,.kp-sub.aan{color:var(--tekst)}
  .kp-item:hover,.kp-sub:hover{color:var(--tekst);background:var(--accent2)}
  .kp-item.aan,.kp-sub.aan{background:var(--accent2);box-shadow:none}
  .kp-streep,.kp-onder{border-color:var(--lijn)}.kp-streep{background:var(--lijn)}.kp-uit{color:var(--zacht)}
  .kp-boven{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10;background:#0b1626;color:#fff;height:58px;padding:0 12px}
  .kp-boven strong{flex:1;font-family:"Space Grotesk",system-ui,sans-serif;font-size:16px}
  .kp-boven .bot-klein{width:28px;height:28px}
  .kp-ham{width:42px;height:42px;border-radius:12px;border:1px solid #1f2f4a;background:none;display:flex;flex-direction:column;justify-content:center;gap:4px;padding:0 12px;cursor:pointer}
  .kp-ham span{height:2px;background:#e6f1ff;border-radius:2px}.kp-ham span:nth-child(1){width:18px}.kp-ham span:nth-child(2){width:12px}.kp-ham span:nth-child(3){width:16px}
  .kp-main{padding:18px 14px 40px}
  .kp-titel h1{display:none}
  .kp-tegels,.kp-twee{grid-template-columns:1fr}
  .kp-held h2{font-size:23px}.kp-tegel b{font-size:34px}
}
.kpz-houder{background:transparent!important;border:0!important;box-shadow:none!important;padding:0!important;display:flex;flex-direction:column;gap:14px}
.kpz-houder>h2,.kpz-houder>.tag{display:none}
.kpz-chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.kpz-chip{flex:none;white-space:nowrap;font:inherit;font-size:13px;font-weight:600;padding:7px 12px;border-radius:999px;border:1px solid var(--lijn);background:#fff;color:#43546e;cursor:pointer}
.kpz-chip.aan{background:#0b1626;color:#fff;border-color:#0b1626}
.kpz-groep{display:flex;flex-direction:column;gap:14px;margin:0!important;padding:18px 20px!important}
.kpz-kop{display:flex;flex-wrap:wrap;gap:14px 20px;align-items:center}
.kpz-titel{display:flex;gap:12px;align-items:center;flex:1 1 240px;min-width:0}.kpz-titel b{display:block;font-size:17px}.kpz-titel .zacht{font-size:13.5px}
.kpz-ic{width:42px;height:42px;border-radius:12px;background:#e3fcf6;display:grid;place-items:center;font-size:20px;flex:none}
.kpz-balk{display:flex;flex-direction:column;gap:4px;min-width:160px;flex:1}
.kpz-spoor{position:relative;height:8px;border-radius:99px;background:linear-gradient(90deg,#bff3e8 0 10%,#e2ecf8 10% 20%,#eef3f9 20%)}
.kpz-spoor span{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;transform:translate(-50%,-50%);background:#fff;border:3px solid #3b82f6;box-sizing:border-box}
.kpz-as{position:relative;height:14px;font-size:11px;color:#7f93af}.kpz-as span{position:absolute}.kpz-as span:nth-child(1){left:0}.kpz-as span:nth-child(2){left:50%;transform:translateX(-50%)}.kpz-as span:nth-child(3){right:0}
.kpz-kans{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:12px;background:#fff8e6;border:1px solid #f5e0a8;font-size:14px;flex-wrap:wrap}.kpz-kans span{flex:1 1 220px}
.kpz-rij{display:grid;grid-template-columns:1fr auto 64px 52px;gap:10px;align-items:center;padding:10px 0;border-top:1px solid #eef3f9;font-size:14.5px}.kpz-rij>span:nth-child(n+3){text-align:right}
.kpz-hoofd{border-top:0;padding:0 0 6px;font-family:"JetBrains Mono",monospace;font-size:11.5px;color:#7f93af}
.kpz-pl{font-style:normal;font-size:11.5px;padding:3px 8px;border-radius:999px;background:#eef3f9;color:#43546e}

@media (max-width:560px){.kpz-rij{grid-template-columns:1fr 52px 44px;font-size:14px}.kpz-rij>span:nth-child(2){display:none}}

<style>
/* ===== Siteregelaar-stijl (Design-canvas) voor het hele portaal ===== */
:root[data-thema=licht]{--bg:#eef4fb;--bg2:#ffffff;--kaart:rgba(255,255,255,.92);--tekst:#0b1626;--zacht:#5b6b82;--lijn:#d9e4f2;--accent:#0b9f8a;--accent2:rgba(34,227,196,.12);--schaduw:0 10px 30px rgba(11,22,38,.06);--veld:#ffffff;--bel:#f2f7fd}
body{background:var(--bg);color:var(--tekst)}
.kp-main{padding:32px 40px 56px}
.kp-titel{margin-bottom:20px}.kp-titel h1{font:700 34px/1.12 "Space Grotesk",system-ui,sans-serif;letter-spacing:-.02em}
.kp-titel p{font-size:16px;color:var(--zacht)}
.kp-main .kaart{border-radius:16px;padding:22px;margin-bottom:16px;border-color:var(--lijn);background:var(--kaart);box-shadow:var(--schaduw)}
.kp-main .kaart h2{font-size:19px;letter-spacing:-.01em;line-height:1.3}
.kp-main .kaart h3{font-size:17px}
.kp-main h2 .tag,.kp-main h3 .tag{display:none}
.kp-main .zacht{color:var(--zacht)}

<script>
let open = new Set(), cache = {}, timer = null;
const SNELKNOPPEN = [
  ["💶", "Prijs aanpassen", "Pas de prijs aan van "],
  ["🏷️", "Sale / actie", "Zet een actie op de site: "],
  ["🛒", "Nieuw product", "Voeg dit nieuwe product toe (foto's erbij): "],
  ["🎟️", "Kortingscode", "Maak een kortingscode: "],
  ["🕘", "Openingstijden", "Pas de openingstijden aan: "],
  ["📢", "Melding bovenaan", "Zet een melding bovenaan de site: "],
  ["✍️", "Tekst aanpassen", "Pas deze tekst aan: "],
  ["📸", "Foto's", "Zet deze foto's op de site: "],
  ["🎬", "Video", "Zet deze video op de site: "],
  ["📰", "Nieuwsbericht", "Schrijf en plaats een nieuwsbericht over "],
  ["🔎", "Beter in Google", "Zorg dat deze pagina beter gevonden wordt in Google: "],
];

$("#uit").onclick = async () => { try { await api("uitloggen"); } catch {} zetSessie(""); location.href = "inloggen"; };

maakInvoer($("#nieuw"), {
  opVersturen: async (tekst, fotos) => {
    toonMelding($("#meld"), "");
    try {
      const r = await api("verzoek_nieuw", { tekst, fotos });
      open.add(r.id);
      if (r.melding) toonMelding($("#meld"), r.melding, "let");
      await laad();
    } catch (e) {
      toonMelding($("#meld"), e.message, e.message.includes("limiet") ? "let" : "fout");
      throw new Error("");
    }
  },
});

$("#snel").innerHTML = SNELKNOPPEN.map(([i, t], n) => `<button type="button" class="snelknop" data-n="${n}"><span>${i}</span>${t}</button>`).join("");
$("#snel").onclick = (e) => {
  const k = e.target.closest(".snelknop"); if (!k) return;
  const ta = $("#nieuw textarea"); const [, , start] = SNELKNOPPEN[k.dataset.n];
  ta.value = start; ta.focus(); ta.setSelectionRange(start.length, start.length);
  document.querySelectorAll(".snelknop").forEach((b) => b.classList.toggle("aan", b === k));
};

async function laadVerzoek(id) {
  const d = await api("verzoek", { id });
  cache[id] = d;
  return d;
}

// Voorstel op de testsite? Dan knoppen "Bekijk de testsite" en "Akkoord" tonen
function testLink(v, d) {
  if (v.status !== "wacht_op_klant" || !d) return "";
  const b = d.verzoek.berichten, laatste = b[b.length - 1];
  if (!laatste || laatste.van !== "webbeheer") return "";
  const m = String(laatste.tekst || "").match(/https?:\/\/[^\s)<>"']*-test\.vercel\.app[^\s)<>"']*/);
  return m ? m[0].replace(/[.,!?]+$/, "") : "";
}

function teken(lijst) {
  const el = $("#lijst");
  if (!lijst.length) { el.innerHTML = `<p class="zacht">Nog geen verzoeken. Je eerste verzoek verschijnt hier.</p>`; return; }
  el.innerHTML = lijst.map((v) => {
    const isOpen = open.has(v.id), d = cache[v.id], actief = ACTIEF.includes(v.status);
    return `<div class="verzoek${actief ? " actief" : ""}" data-id="${v.id}">
      ${actief ? `<div class="balk" aria-label="Bezig"></div>` : ""}
      <div class="hoofd"><span class="nr">#${v.nr}</span><span class="titel">${esc(v.onderwerp)}</span>
        <span class="chip ${v.status}">${STATUS[v.status]}</span></div>
      ${actief && !isOpen ? `<div style="padding:0 16px 4px">${wachtHtml(v.status, v.bijgewerkt)}</div>` : ""}
      ${isOpen && !d ? `<div class="lijf"><p class="zacht">Laden…</p></div>` : ""}
      ${isOpen && d ? `<div class="lijf">
        ${berichtenHtml(d.verzoek.berichten)}
        ${testLink(v, d) ? `<div class="testpaneel">
          <div class="tp-kop">${robotSvg("rust")}<div><div class="fase">&gt;_ klaar op de testsite</div>
            <div class="zacht">Bekijk het voorbeeld. Goed? Dan zet ik het met één klik op je echte website.</div></div></div>
          <div class="tp-knoppen">
            <a class="knop rand groot" href="${esc(testLink(v, d))}" target="_blank" rel="noopener">👀 Bekijk de testsite</a>
            <button class="knop groot akkoord">✓ Akkoord, zet het live</button></div></div>` : ""}
        ${actief ? wachtHtml(v.status, v.bijgewerkt) : ""}
        ${!actief && d.reacties_over > 0 ? `<div class="reactie" style="margin-top:12px"></div>` : ""}
        ${!actief && d.reacties_over === 0 ? `<p class="zacht">Dit gesprek is vol. Start hierboven een nieuw verzoek.</p>` : ""}
        ${v.status === "klaar" ? `<div class="rij" style="margin-top:8px"><button class="knop rand klein terug">↩ Deze aanpassing terugdraaien</button></div>` : ""}
        <div class="verborgen fout"></div>
      </div>` : ""}
    </div>`;
  }).join("");
  tikWacht();

  el.querySelectorAll(".verzoek").forEach((blok) => {
    const id = blok.dataset.id;
    $(".hoofd", blok).onclick = () => {
      if (open.has(id)) { open.delete(id); teken(lijst); return; }
      open.add(id); teken(lijst);                       // direct openen
      laadVerzoek(id).then(() => { if (open.has(id)) teken(lijst); }).catch(() => {});  // daarna verversen
    };
    const r = $(".reactie", blok);
    if (r) maakInvoer(r, {
      plaats: "Reageer of geef een aanvulling…", knop: "Reageren",
      opVersturen: async (tekst, fotos) => { await api("reageer", { id, tekst, fotos }); await laad(); },
    });
    const ak = $(".akkoord", blok);
    if (ak) ak.onclick = async () => {
      ak.disabled = true; ak.textContent = "Bezig…";
      try { await api("reageer", { id, tekst: "Akkoord, zet het maar live." }); await laad(); }
      catch (e) { ak.disabled = false; ak.textContent = "✓ Akkoord, zet het live"; toonMelding($(".fout", blok), e.message); }
    };
    const t = $(".terug", blok);
    if (t) t.onclick = async () => {
      if (!confirm("Weet je zeker dat je deze aanpassing wilt terugdraaien?")) return;
      try { await api("terugdraaien", { id }); await laad(); }
      catch (e) { toonMelding($(".fout", blok), e.message); }
    };
  });
}

let laatsteLijst = [];
async function laad(geforceerd = true) {
  clearTimeout(timer);
  try {
    const { verzoeken } = await api("verzoeken_lijst");
    // open blokken verversen
    await Promise.all([...open].filter((id) => verzoeken.some((v) => v.id === id)).map((id) => laadVerzoek(id).catch(() => {})));
    const veranderd = JSON.stringify(verzoeken) !== JSON.stringify(laatsteLijst);
    const typt = [...document.querySelectorAll(".reactie textarea")].some((t) => t.value.trim()) ||
      (document.activeElement && document.activeElement.closest(".reactie"));
    if (geforceerd || (veranderd && !typt)) teken(verzoeken);
    laatsteLijst = verzoeken;
    verzoeken.slice(0, 8).filter((v) => !cache[v.id]).forEach((v) => laadVerzoek(v.id).catch(() => {}));
    const iemandActief = verzoeken.some((v) => ACTIEF.includes(v.status));
    timer = setTimeout(() => laad(false), iemandActief ? 4000 : 30000);
  } catch (e) {
    timer = setTimeout(() => laad(false), 15000);
  }
}

$("#kopbot").innerHTML = robotSvg("rust");
// Alleen Sitehulpje besteld? Dan eerst één stap: ons toegang geven tot de website.
async function shStart(el) {
  const SB = API.replace(/beheersite$/, "vb-bestel");
  const vraag = async (actie, data = {}) => { const r = await fetch(SB, { method: "POST", headers: { "Content-Type": "application/json", "X-Sessie": sessie() }, body: JSON.stringify({ actie, ...data }) });
    const d = await r.json().catch(() => ({})); if (!r.ok) throw new Error(d.fout || "Er ging iets mis."); return d; };
  let d; try { d = await vraag("sh_status"); } catch { return; }
  if (!d.nodig) { el.innerHTML = ""; return; }
  el.innerHTML = `<div class="kaart" style="border-left:4px solid var(--accent)">
    <h2 style="margin:0 0 6px"><span class="tag">1</span>Koppel je website</h2>
    <p style="margin:0 0 10px">Om je website te kunnen aanpassen moet Sitehulpje erbij kunnen. Je eigen wachtwoord hoef je nooit te delen.</p>
    <div data-vbsite></div></div>`;
  vbSiteToon(el.querySelector("[data-vbsite]"), undefined, {});
}
api("ik").then((d) => {
  if (d.gebruiker.rol === "admin" && !d.klant) { location.href = "beheer"; return; }
  $("#site").textContent = d.klant ? `${d.klant.naam} · ${d.klant.site.replace(/^https?:\/\//, "")}` : "";
  laad();
  appTip($("#appTip"));
  if (d.klant) { vbfPauzeMelding($("#vbpauze")); vbfOpzegKlant($("#abonnement")); shStart($("#shstart")); vbfVriend($("#vriend")); }
  const vbPromo = () => vbfApi("status").then((p) => {
    if (p.pauze || !d.klant) return;
    kpMenu(false);
    $("#vbpromo").innerHTML = `<div class="kaart">
      <h2 style="margin:0 0 6px">Beter gevonden worden in Google én AI</h2>
      <p class="zacht" style="margin:0 0 10px">Met Vindbaarheid controleren we je website elke week, verbeteren we je teksten voor Google en zie je in een helder overzicht hoe vaak je gevonden wordt. Ook in ChatGPT en andere AI.</p>
      <ul class="vb-goed" style="margin-bottom:12px"><li>Elke week een website-check</li><li>Betere teksten voor Google, jij keurt goed met één klik</li><li>Je cijfers uit Google en Bing</li><li>Elke maand een rapport in gewone taal</li></ul>
      <p style="margin:0 0 12px"><b>Vanaf €99 per maand.</b> <span class="zacht">Met Vindbaarheid erbij kost Sitehulpje nog maar €75 per maand.</span></p>
      <a class="knop" href="https://siteregelaar.nl/vindbaarheid#pakketten">Bekijk de pakketten</a></div>`;
    shAanbodLaad();
  }).catch(() => {});
  vbApi("status").then((s) => {
    if (!s.klant.aan) return vbPromo();
    kpMenu(true);
    vbsApi("status").then((st) => { if (!st.klant_klaar) { kpStartOpen = true; kpNaar("overzicht"); } }).catch(() => {});
    shAanbodLaad(); // klant met Vindbaarheid: eventueel het advertentie-aanbod
    if (d.klant && d.klant.id !== "luxe-overhemden") shWebbeheerAanbod(); // alleen Vindbaarheid: geen verzoeken, wel aanbod webbeheer
  }).catch((e) => { if (/staat niet aan/.test(e.message || "")) vbPromo(); });
});


// ================= Sitehulpje-aanbod: 20% korting op Vindbaarheid voor klanten met alleen Sitehulpje
var shAanbod = null;
const SHA_API = "https://dauvsivoxfdfzurmyuug.supabase.co/functions/v1/sh-aanbod";
async function shaApi(data) {
  const x = await fetch(SHA_API, { method: "POST", headers: { "Content-Type": "application/json", "X-Sessie": sessieVan("klant") }, body: JSON.stringify(data) });
  const d = await x.json().catch(() => ({}));
  if (!x.ok) throw new Error(d.fout || "Er ging iets mis.");
  return d;
}
const shaEu = (n) => "€ " + Number(n).toFixed(2).replace(".", ",").replace(",00", "");
function shAanbodLaad() {
  shaApi({ actie: "status" }).then((a) => {
    if (!a.mag && a.ads_mag) return shAdsAanbod(a);
    if (!a.mag) return;
    shAanbod = a; kpTekenMenu();
    let later = 0; try { later = Number(localStorage.getItem("sh_aanbod_later") || 0); } catch {}
    if (Date.now() - later > 7 * 86400000) {
