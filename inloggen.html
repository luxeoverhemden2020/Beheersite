<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sitehulpje – Inloggen</title>
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sitehulpje">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="assets/stijl.css?v=20261110f">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="96x96" href="/assets/favicon-96.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
</head>
<body>
<div class="inlog">
  <div style="text-align:right"><button class="knop rand klein thema" type="button"></button></div>
  <div class="kaart">
    <div id="bot"></div>
    <h1>Site<span style="color:var(--accent)">hulpje</span></h1>
    <p class="zacht sub" id="uitleg">Log in om aanpassingen aan je website door te geven.</p>
    <form id="inlog">
      <div id="emailveld"><label for="email">E-mailadres</label>
      <input id="email" type="email" autocomplete="username" required></div>
      <label for="ww" id="wwlabel">Wachtwoord</label>
      <input id="ww" type="password" autocomplete="current-password" required minlength="1">
      <div id="ww2veld" class="verborgen"><label for="ww2">Herhaal wachtwoord</label>
      <input id="ww2" type="password" autocomplete="new-password"></div>
      <div id="meld" class="verborgen"></div>
      <button class="knop" style="width:100%;margin-top:14px" id="knop">Inloggen</button>
    </form>
    <p style="text-align:center;margin:12px 0 0" id="vergetenrij"><a href="#" id="vergeten" class="zacht">Inloglink of wachtwoord kwijt?</a></p>
  </div>
</div>
<script src="assets/basis.js"></script>
<script>
$("#bot").innerHTML = robotSvg("zwaai kijkt");
const code = new URLSearchParams(location.search).get("code");
if (code) {
  $("#uitleg").textContent = "Kies je eigen wachtwoord voor het beheerscherm (minimaal 8 tekens).";
  $("#emailveld").classList.add("verborgen"); $("#email").required = false;
  $("#wwlabel").textContent = "Nieuw wachtwoord"; $("#ww").autocomplete = "new-password"; $("#ww").minLength = 8;
  $("#ww2veld").classList.remove("verborgen"); $("#knop").textContent = "Wachtwoord opslaan";
}
// Wachtwoord vergeten
const WW_API = "https://dauvsivoxfdfzurmyuug.supabase.co/functions/v1/vb-wachtwoord";
const wwApi = async (data) => {
  const r = await fetch(WW_API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data) }).catch(() => { throw new Error("Geen verbinding. Probeer het opnieuw."); });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.fout || "Er ging iets mis.");
  return d;
};
const herstel = new URLSearchParams(location.search).get("herstel");
let vergeten = false;
if (herstel) {
  history.replaceState(null, "", location.pathname);
  $("#uitleg").textContent = "Kies een nieuw wachtwoord (minimaal 8 tekens).";
  $("#emailveld").classList.add("verborgen"); $("#email").required = false;
  $("#wwlabel").textContent = "Nieuw wachtwoord"; $("#ww").autocomplete = "new-password"; $("#ww").minLength = 8;
  $("#ww2veld").classList.remove("verborgen"); $("#knop").textContent = "Wachtwoord opslaan";
  $("#vergetenrij").classList.add("verborgen");
}
const direct = new URLSearchParams(location.search).get("direct");
if (direct) {
  history.replaceState(null, "", location.pathname);
  $("#uitleg").textContent = "Even inloggen…";
  wwApi({ actie: "direct", token: direct }).then((d) => {
    bewaar(d.rol, d.token);
    if (d.link) { try { localStorage.setItem("bs_link", d.link); } catch {} }
    location.href = d.rol === "admin" ? "beheer" : "verzoeken";
  }).catch((e) => { $("#uitleg").textContent = "Log in om aanpassingen aan je website door te geven."; toonMelding($("#meld"), e.message); });
}
$("#vergeten").onclick = (e) => {
  e.preventDefault();
  vergeten = true;
  $("#uitleg").textContent = "Vul je e-mailadres in. Je krijgt een mail waarmee je direct kunt inloggen of een nieuw wachtwoord kunt kiezen.";
  $("#wwlabel").classList.add("verborgen"); $("#ww").classList.add("verborgen"); $("#ww").required = false;
  $("#knop").textContent = "Stuur de link"; $("#vergetenrij").classList.add("verborgen"); toonMelding($("#meld"), "");
  $("#email").focus();
};
const voorBeheer = new URLSearchParams(location.search).get("voor") === "beheer";
if (voorBeheer) $("#uitleg").textContent = "Log in op het beheerscherm.";
// Bewaar de sessie in het juiste vakje: beheerder en klant staan los van elkaar.
const bewaar = (rol, token) => zetSessieVan(rol === "admin" ? "beheer" : "klant", token);
async function naarScherm() {
  // Al ingelogd? Dan direct door. Bij "voor=beheer" alleen met een beheer-sessie.
  for (const soort of voorBeheer ? ["beheer"] : ["beheer", "klant"]) {
    const t = sessieVan(soort);
    if (!t) continue;
    try {
      const d = await api("ik", {}, t);
      if (soort === "beheer" && d.gebruiker.rol === "admin") { location.href = "beheer"; return; }
      if (soort === "klant") { location.href = d.gebruiker.rol === "admin" && !d.klant ? "beheer" : "verzoeken"; return; }
    } catch { zetSessieVan(soort, ""); }
  }
}
const link = new URLSearchParams(location.search).get("link");
if (link) {
  history.replaceState(null, "", location.pathname);
  $("#uitleg").textContent = "Even inloggen…";
  api("link_inloggen", { link }).then((d) => { zetSessieVan("klant", d.token); try { localStorage.setItem("bs_link", link); } catch {} location.href = "verzoeken"; })
    .catch((e) => { $("#uitleg").textContent = "Log in om aanpassingen aan je website door te geven."; toonMelding($("#meld"), e.message); });
} else if (!code && !herstel && !direct) naarScherm();
$("#inlog").onsubmit = async (e) => {
  e.preventDefault();
  toonMelding($("#meld"), "");
  $("#knop").disabled = true;
  try {
    if (vergeten) {
      await wwApi({ actie: "vraag", email: $("#email").value });
      $("#uitleg").textContent = "Als dit adres bij ons bekend is, staat de mail er zo. Kijk ook even in je spam. De knoppen werken 1 uur.";
      $("#inlog").classList.add("verborgen");
      return;
    }
    if (herstel) {
      if ($("#ww").value !== $("#ww2").value) throw new Error("De wachtwoorden zijn niet gelijk.");
      await wwApi({ actie: "zet", token: herstel, wachtwoord: $("#ww").value });
      location.href = "inloggen";
      return;
    }
    let d;
    if (code) {
      if ($("#ww").value !== $("#ww2").value) throw new Error("De wachtwoorden zijn niet gelijk.");
      d = await api("eerste_wachtwoord", { code, wachtwoord: $("#ww").value });
    } else {
      d = await api("inloggen", { email: $("#email").value, wachtwoord: $("#ww").value });
    }
    bewaar(d.rol, d.token);
    location.href = d.rol === "admin" ? "beheer" : "verzoeken";
  } catch (err) { toonMelding($("#meld"), err.message); }
  $("#knop").disabled = false;
};
</script>
</body>
</html>
